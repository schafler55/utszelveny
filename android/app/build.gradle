plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.szaszi.kozutszelveny'
    compileSdk 34

    defaultConfig {
        applicationId "hu.szaszi.kozutszelveny"
        minSdk 26          // Android 8.0
        targetSdk 34
        // one digit per version part: V1.1.0 → 1100, V1.1.0.1 → 1101 (text-only), V1.1.1 → 1110, V1.2.0 → 1200
        // (each part must stay below 10)
        versionCode 1220
        versionName "1.2.2"
        resValue 'string', 'app_name', 'ÚtSzelvény'
    }

    // Signing is not done here: GitHub Actions builds an unsigned APK and a separate job signs it
    // (.github/scripts/sign-apk.sh), so the Gradle build never sees a key.
    //   - stable releases (V* tags): the real app, signed with the release key (always the same key,
    //     so a new APK installs over the previous one without uninstalling)
    //   - every other build (UTSZ_BUILD=dev): "ÚtSzelvény DEV", own package id, so it installs next to
    //     the real app with its own saved data; signed with the dev key
    def devBuild = System.getenv('UTSZ_BUILD') == 'dev'
    buildTypes {
        release {
            minifyEnabled false
            if (devBuild) {
                applicationIdSuffix '.dev'
                resValue 'string', 'app_name', 'ÚtSzelvény DEV'
            }
        }
    }

    // DEV builds get their own launcher icon (red ring, "DEV" sign): every file in src/dev/res replaces the file
    // with the same name in src/main/res (now only the adaptive icon's foreground layer, ic_launcher_foreground.png
    // in five sizes). Stable releases never read src/dev/res.
    if (devBuild) {
        sourceSets.release.res.srcDirs = ['src/dev/res']
    }

    // same as the earlier debug builds: lint does not stop the release build
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
