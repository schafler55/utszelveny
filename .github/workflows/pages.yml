name: Web app (GitHub Pages)

# Publishes the website straight to GitHub Pages (Settings → Pages → Source: GitHub Actions);
# nothing is committed to the repository.
#   https://utszelveny.hu/                 = landing page (site/ of main), once main has a site/ folder
#   https://utszelveny.hu/app/             = web/ of the latest stable release (v* tag), the real app
#                                            (without site/ on main the real app stays at the root)
#   https://utszelveny.hu/dev/             = web/ of main (development, not yet released)
#   https://utszelveny.hu/test/<branch>/   = test page of every other branch; a branch with a site/
#                                            folder gets its landing page there and its app in app/
# (custom domain set in Settings → Pages; the old https://schafler55.github.io/utszelveny/ address forwards here)
# The whole site is rebuilt each time, so a deleted branch's test page disappears.
# Only main may deploy to Pages, so a push to a test branch or a published release asks main to rebuild
# (workflow_dispatch), and a branch delete runs on main by itself.
# The landing page's APK link is set to the latest stable release's APK file at every build; the Android
# workflow asks for one more rebuild once it has attached the APK to a new stable release.
# The dev and test pages are kept out of search results (noindex, and robots.txt of the landing page).
# The dev and test pages have their own saved data (kszd_* / kszt_* keys), no service worker (it would clear the
# real app's offline cache) and a small label; the app sees the renamed keys and does no update check there.

on:
  push:
    branches: ['**']
  release:
    types: [published]
  delete:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask main to rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

  build:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src

      - name: Build the site
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/_site"
          mkdir -p "$OUT"
          # with a landing page (site/) the real app moves to app/
          if [ -f site/index.html ]; then APP="$OUT/app"; else APP="$OUT"; fi
          mkdir -p "$APP"

          # the real app: web/ of the latest stable release (main until there is one)
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$TAG" ] && git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"; then
            if git cat-file -e "$TAG:web/index.html" 2>/dev/null; then
              git archive "$TAG" web | tar -x -C "$RUNNER_TEMP" && cp -r "$RUNNER_TEMP/web/." "$APP/"
            else   # V1.0 still had the app in the repository root
              for f in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png szovegek.html; do
                git show "$TAG:$f" > "$APP/$f" 2>/dev/null || rm -f "$APP/$f"
              done
            fi
            echo "real app: release $TAG"
          else
            echo "::warning::no stable release found, the real app is main"
            cp -r web/. "$APP/"
          fi
          test -s "$APP/index.html"
          # the texts overview belongs to the development version: the real app's address forwards there
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=dev/szovegek.html"><title>ÚtSzelvény – szövegek</title><a href="dev/szovegek.html">dev/szovegek.html</a>' > "$OUT/szovegek.html"
          if [ "$APP" != "$OUT" ]; then
            sed 's#url=dev/#url=../dev/#; s#href="dev/#href="../dev/#' "$OUT/szovegek.html" > "$APP/szovegek.html"
            # landing page of main at the root (its sw.js removes the service worker the app used to have here)
            cp -r site/. "$OUT/"
            cp web/icon-192.png web/icon-512.png "$OUT/"
            test -s "$OUT/index.html"
            # the APK link (id="apkLink") downloads the latest stable release's APK file directly;
            # without one (e.g. the APK build is still running) it keeps pointing to the releases page
            APK=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '[.assets[] | select(.name | endswith(".apk")) | .browser_download_url][0] // empty' 2>/dev/null || true)
            if [ -n "$APK" ]; then
              sed -i "s#<a id=\"apkLink\" href=\"[^\"]*\"#<a id=\"apkLink\" href=\"$APK\"#" "$OUT/index.html"
              grep -q "href=\"$APK\"" "$OUT/index.html"
              echo "landing page APK link: $APK"
            else
              echo "::warning::no APK in the latest stable release yet, the landing page links the releases page"
            fi
            echo "landing page: / (site/ of main), real app: app/"
          fi

          # dev page: main as it is now (same changes as the test pages, DEV label)
          grep -q 'id="texts"' web/index.html
          VER=$(sed -n 's#.*<title>\(.*\)</title>.*#\1#p' web/index.html | head -1 | sed 's/^ÚtSzelvény //')
          mkdir -p "$OUT/dev"
          sed \
            -e 's/"ksz_/"kszd_/g' \
            -e 's|navigator.serviceWorker.register("sw.js")|Promise.reject()|' \
            -e "s#<title>\(.*\)</title>#<title>\1 – DEV</title>#" \
            -e 's|</head>|<meta name="robots" content="noindex"></head>|' \
            -e "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:#7c3aed;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">DEV · $VER</div></body>|" \
            web/index.html > "$OUT/dev/index.html"
          grep -q 'DEV · ' "$OUT/dev/index.html"
          cp web/icon-192.png web/icon-512.png web/szovegek.html "$OUT/dev/"
          echo "dev page: dev/ ($VER)"

          # test pages: one per branch except main.
          # Own settings (kszt_* keys), no service worker (it would clear the real app's offline cache),
          # and a small TESZT label. Older branches still have the app in the repository root.
          git ls-remote --heads origin | sed 's#.*refs/heads/##' | while read -r B; do
            [ "$B" = "main" ] && continue
            git fetch -q --depth 1 origin "refs/heads/$B:refs/remotes/origin/$B" || { echo "skip $B"; continue; }
            R="origin/$B"
            if git cat-file -e "$R:web/index.html" 2>/dev/null; then P="web/"
            elif git cat-file -e "$R:index.html" 2>/dev/null; then P=""
            else echo "skip $B (no index.html)"; continue; fi
            D="$OUT/test/$B"
            # a branch with a landing page (site/): landing page in test/<branch>/, its app in test/<branch>/app/
            if git cat-file -e "$R:site/index.html" 2>/dev/null; then A="$D/app"; else A="$D"; fi
            mkdir -p "$A"
            git show "$R:${P}index.html" | sed \
              -e 's/"ksz_/"kszt_/g' \
              -e 's|navigator.serviceWorker.register("sw.js")|Promise.reject()|' \
              -e "s#<title>\(.*\)</title>#<title>\1 – TESZT ($B)</title>#" \
              -e 's|</head>|<meta name="robots" content="noindex"></head>|' \
              -e "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:#dc2626;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">TESZT · $B</div></body>|" \
              > "$A/index.html"
            grep -q 'TESZT' "$A/index.html"
            for f in icon-192.png icon-512.png szovegek.html; do
              git show "$R:$P$f" > "$A/$f" 2>/dev/null || rm -f "$A/$f"
            done
            if [ "$A" != "$D" ]; then
              rm -rf "$RUNNER_TEMP/site"
              git archive "$R" site | tar -x -C "$RUNNER_TEMP"
              cp -r "$RUNNER_TEMP/site/." "$D/"
              rm -f "$D/sw.js"   # only the real site root had the app's service worker
              cp "$A/icon-192.png" "$A/icon-512.png" "$D/" 2>/dev/null || true
              sed -i 's|<meta name="robots" content="[^"]*">|<meta name="robots" content="noindex">|' "$D/index.html"
              sed -i "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:#dc2626;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">TESZT · $B</div></body>|" "$D/index.html"
              echo "test page: test/$B/ (landing page), test/$B/app/ (app)"
            else
              echo "test page: test/$B/"
            fi
          done

          echo "Site files:"; (cd "$OUT" && find . -type f | sort)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
