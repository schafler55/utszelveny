name: Android APK

on:
  push:
    branches: ['**']
    # a version tag (v1.0, v1.1 … or V1.0) publishes a stable release
    tags: ['v*', 'V*']
    # pushes that only change docs build no APK (GitHub never applies path filters to tag pushes: releases always build)
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

# a newer push of the same branch cancels the run still going: two quick pushes could otherwise finish in the wrong
# order, and the older run would remove the newer APK from the pre-release
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# Every job gets only the access it needs (see the jobs below).
permissions:
  contents: read

# Security layout (see the security audit, finding M1):
#   build         – builds an UNSIGNED APK; no signing key here, so the Gradle build and the third-party
#                   setup action never see one
#   sign-dev      – every build except stable releases: signs with the dev key → "ÚtSzelvény DEV"
#                   (package hu.szaszi.kozutszelveny.dev, installs next to the real app, own saved data)
#   sign-release  – only version tags: signs with the release key from the protected "release" environment
#                   (Settings → Environments; only V*/v* tags, waits for the owner's approval)
#   both sign jobs fail, and nothing is published, when the APK is not signed with the expected certificate
#   (EXPECT_CERT below, checked in .github/scripts/sign-apk.sh)
#   publish       – puts the signed APK into the GitHub release with GitHub's own gh tool; no signing key and
#                   no third-party action here (security re-audit, R2): this is the one job that may write to
#                   the repository
# Google Play: every run also builds an app bundle (.aab) and signs it in the same job as the APK, with the same key
# and the same certificate check (.github/scripts/sign-aab.sh). It is not published: it is kept as a workflow
# artifact (Actions → the run → Artifacts) to upload in Play Console; a stable release's bundle is the one for Play.
# All actions are pinned to a full commit SHA (the comment shows the version); Dependabot proposes updates.
# The only third-party action left is gradle/actions/setup-gradle, in the build job (no key, read-only access).

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.apk.outputs.name }}
      ver: ${{ steps.apk.outputs.ver }}
      aab: ${{ steps.apk.outputs.aab }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'   # Android Gradle plugin 8.13 needs Gradle 8.13
          # the open-source (MIT) cache; the default "enhanced" cache is closed-source and under Gradle's own terms
          cache-provider: basic

      - name: Find the Android project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found - the android folder is not in the repository. Files in the repository:"
            find . -not -path "./.git*" -type f | sort | head -100
            exit 1
          fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $d"

      # the texts block (id="texts") must be valid JSON and hold every key the app asks for
      - name: Check the texts block
        run: python3 tools/szovegek.py web/index.html

      # every place of the version number agrees, and a stable release's tag is that version (tools/verzio.py)
      - name: Check the version numbers
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then python3 tools/verzio.py --tag "$TAG"; else python3 tools/verzio.py; fi

      # File name carries the version (stable release, main) or the branch name + build number (test branches),
      # e.g. UtSzelveny-V1.3.0.apk, UtSzelveny-DEV-V1.2.1.apk and UtSzelveny-test-auto-V1.2.1-b123.apk
      - name: Name the APK
        id: apk
        env:
          B: ${{ github.ref_name }}
          D: ${{ steps.proj.outputs.dir }}
          RUN: ${{ github.run_number }}
        run: |
          vn=$(grep -m1 'versionName' "$D/app/build.gradle" | sed -E 's/.*"([^"]+)".*/\1/')
          ver="V$(echo "$vn" | sed -E 's/-beta$/-Beta/; s/-stable$/-Stable/')"
          br=$(echo "$B" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="UtSzelveny-$ver.apk"; label=""
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            name="UtSzelveny-DEV-$ver.apk"; label="DEV · $ver"; bg="#7c3aed"
          else
            name="UtSzelveny-test-$br-$ver-b$RUN.apk"; label="TESZT · $br"; bg="#dc2626"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "aab=${name%.apk}.aab" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "bg=${bg:-}" >> "$GITHUB_OUTPUT"
          echo "APK: $name"

      # Stable releases get web/index.html unchanged. The DEV app gets the same changes as the /dev/ web page:
      # renamed saved-data keys (kszd_), so it never offers the real app as its update, and a small DEV / TESZT
      # label. The DEV build of main also gets the update channel "dev" (UPD_CH): it looks for a newer APK in
      # the "apk-latest" release. Test builds keep "stable" and, with the renamed keys, do no update check.
      - name: Copy the web app (web/index.html) into the APK
        env:
          D: ${{ steps.proj.outputs.dir }}
          LABEL: ${{ steps.apk.outputs.label }}
          BG: ${{ steps.apk.outputs.bg }}
        run: |
          mkdir -p "$D/app/src/main/assets"
          out="$D/app/src/main/assets/index.html"
          if [ -z "$LABEL" ]; then
            cp web/index.html "$out"
          else
            ch=stable; case "$LABEL" in DEV*) ch=dev;; esac
            sed \
              -e 's/"ksz_/"kszd_/g' \
              -e "s/const UPD_CH=\"stable\"/const UPD_CH=\"$ch\"/" \
              -e "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:$BG;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">$LABEL</div></body>|" \
              web/index.html > "$out"
            grep -q "$LABEL" "$out"
            grep -q 'UPD_KEY="kszd_"' "$out"
            grep -q "const UPD_CH=\"$ch\"" "$out"
          fi

      # Android developer verification: the account's registration token (android/adi-registration.properties,
      # from the Android Developer Console) goes into every APK's assets as adi-registration.properties. An APK
      # signed with the release key (stable release) or the DEV key (main) then proves to Google that this account
      # owns that key; the token alone proves nothing and is not a secret.
      - name: Add the developer verification token to the APK
        env:
          D: ${{ steps.proj.outputs.dir }}
        run: cp android/adi-registration.properties "$D/app/src/main/assets/adi-registration.properties"

      - name: Build the unsigned APK and app bundle
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          UTSZ_BUILD: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Keep the unsigned APK and app bundle for the signing job
        env:
          D: ${{ steps.proj.outputs.dir }}
        run: |
          cp "$D/app/build/outputs/apk/release/app-release-unsigned.apk" unsigned.apk
          cp "$D/app/build/outputs/bundle/release/app-release.aab" unsigned.aab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: |
            unsigned.apk
            unsigned.aab
          retention-days: 1

  # Dev key: repository secrets DEV_KEYSTORE_B64 / DEV_KEYSTORE_PASSWORD / DEV_KEY_ALIAS.
  # Dependabot's runs get no repository secrets, so they stop after the build (which is what they test).
  sign-dev:
    needs: build
    if: github.ref_type != 'tag' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Sign with the dev key
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          KEY_HINT: add DEV_KEYSTORE_B64, DEV_KEYSTORE_PASSWORD and DEV_KEY_ALIAS under Settings → Secrets and variables → Actions
          # certificate of the "ÚtSzelvény DEV" builds (public value); the same check as for stable releases, so
          # every build of main proves that the check itself works
          EXPECT_CERT: abd3fd7f83e9f2726afa4cc644a515997c3f35311222c42a1290519c9c4c4a88
          APK: ${{ needs.build.outputs.name }}
        run: bash .github/scripts/sign-apk.sh unsigned/unsigned.apk "$APK"

      # the DEV bundle is never uploaded to Play; signing it proves on every push that the bundle build and its key check work
      - name: Sign the app bundle with the dev key
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          KEY_HINT: add DEV_KEYSTORE_B64, DEV_KEYSTORE_PASSWORD and DEV_KEY_ALIAS under Settings → Secrets and variables → Actions
          EXPECT_CERT: abd3fd7f83e9f2726afa4cc644a515997c3f35311222c42a1290519c9c4c4a88
          AAB: ${{ needs.build.outputs.aab }}
        run: bash .github/scripts/sign-aab.sh unsigned/unsigned.aab "$AAB"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ needs.build.outputs.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.aab }}
          path: ${{ needs.build.outputs.aab }}
          retention-days: 7

  # Release key: only in the "release" environment (Settings → Environments → release), which only V*/v* tags
  # may use and which waits for the owner's approval (Actions tab → the run → Review deployments).
  # This job runs only GitHub's own actions and the signing script from this repository.
  sign-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Sign with the release key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_HINT: add RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS under Settings → Environments → release → Environment secrets
          # SHA-256 of the certificate of the published stable releases (V1.0 – V1.2.0; public value, anyone can read it
          # from the APK: C=HU, O=UtSzelveny, CN=Szaszi Daniel). A release signed with any other key could not be
          # installed over the app people have, so sign-apk.sh fails and nothing is published. Change it only if the
          # release key itself is ever replaced on purpose (every user would then have to reinstall).
          EXPECT_CERT: 26063c1d3c66598dea90e4853756e4ad7ef6514dd6ebdbd6f03e34413d0b76e0
          APK: ${{ needs.build.outputs.name }}
        run: bash .github/scripts/sign-apk.sh unsigned/unsigned.apk "$APK"

      # the bundle for Google Play: same key as the APK (Play App Signing holds this key as the app signing key and
      # also accepts it as the upload key), so Play and GitHub APKs update each other
      - name: Sign the app bundle with the release key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_HINT: add RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS under Settings → Environments → release → Environment secrets
          EXPECT_CERT: 26063c1d3c66598dea90e4853756e4ad7ef6514dd6ebdbd6f03e34413d0b76e0
          AAB: ${{ needs.build.outputs.aab }}
        run: bash .github/scripts/sign-aab.sh unsigned/unsigned.aab "$AAB"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ needs.build.outputs.name }}

      # for Google Play (Play Console → Test and release → create a release → upload this file); not on the release page
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.aab }}
          path: ${{ needs.build.outputs.aab }}
          retention-days: 90

  publish:
    needs: [build, sign-dev, sign-release]
    if: always() && needs.build.result == 'success' && (needs.sign-dev.result == 'success' || needs.sign-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write     # a stable release asks the Pages workflow to rebuild (landing page APK link)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.name }}

      # Where the APK goes:
      #   test branch → pre-release "apk-test-<branch>" (the public "apk-latest" stays untouched until the branch
      #                 is merged into main)
      #   main        → pre-release "apk-latest"
      #   version tag → the stable, non-pre-release GitHub Release, marked Latest (/releases/latest points to it);
      #                 release notes written by hand on GitHub are kept, the two lines below are added after them
      # The release is created when it does not exist yet; an APK with the same name is replaced.
      - name: Publish the APK to its release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.build.outputs.name }}
          VER: ${{ needs.build.outputs.ver }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"; B="$GITHUB_REF_NAME"
          INSTALL="Telepítés: töltsd le az APK fájlt a telefonon, és engedélyezd az ismeretlen forrásból történő telepítést."
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$B"; TITLE="ÚtSzelvény $VER"
            printf '%s\n' "ÚtSzelvény $VER – stabil kiadás. Változások: [CHANGELOG.md](https://github.com/$R/blob/$B/CHANGELOG.md)" \
              "$INSTALL" > notes.md
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="apk-latest"; TITLE="ÚtSzelvény – legfrissebb APK (DEV)"
            printf '%s\n' "Automatikusan épített APK a main ág legutóbbi állapotából: $FILE" \
              "„ÚtSzelvény DEV” néven, a rendes alkalmazás mellé települ, saját mentett adatokkal. A stabil kiadás: https://github.com/$R/releases/latest" \
              "$INSTALL" > notes.md
          else
            TAG="apk-test-$B"; TITLE="ÚtSzelvény – TESZT APK ($B ág)"
            printf '%s\n' "TESZT változat a(z) $B ágból – nem a hivatalos kiadás." \
              "„ÚtSzelvény DEV” néven, a rendes alkalmazás mellé települ, saját mentett adatokkal; a korábbi DEV / TESZT telepítést felülírja." > notes.md
          fi
          if gh release view "$TAG" -R "$R" --json body -q .body > old.md 2>/dev/null; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              if grep -qF "stabil kiadás. Változások:" old.md; then
                cp old.md notes.md                                  # a second run adds the lines only once
              elif grep -q '[^[:space:]]' old.md; then
                { cat old.md; echo; cat notes.md; } > both.md; mv both.md notes.md
              fi
              gh release edit "$TAG" -R "$R" --title "$TITLE" --notes-file notes.md --prerelease=false --latest
            else
              gh release edit "$TAG" -R "$R" --title "$TITLE" --notes-file notes.md --prerelease
            fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" -R "$R" --verify-tag --title "$TITLE" --notes-file notes.md --latest
          else
            gh release create "$TAG" -R "$R" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --prerelease
          fi
          gh release upload "$TAG" "$FILE" -R "$R" --clobber

      # The landing page links the stable release's APK file directly: rebuild the site now that it is attached.
      - name: Update the landing page APK link
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

      # Only the newest APK stays in the release (older file names are removed).
      - name: Remove older APKs from the release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/main' && 'apk-latest' || format('apk-test-{0}', github.ref_name) }}
          KEEP: ${{ needs.build.outputs.name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            if [ -n "$a" ] && [ "$a" != "$KEEP" ]; then
              echo "removing $a"; gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" -y
            fi
          done
