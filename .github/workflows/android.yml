name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the web app (index.html) into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KozutSzelveny.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KozutSzelveny-apk
          path: KozutSzelveny.apk

      - name: Publish to the "apk-latest" release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: KözútSzelvény – legfrissebb APK
          prerelease: true
          files: KozutSzelveny.apk
          body: |
            Automatikusan épített APK a main ág legutóbbi állapotából.
            Telepítés: töltsd le a KozutSzelveny.apk fájlt a telefonon, és engedélyezd az ismeretlen forrásból történő telepítést.
