name: Android APK

on:
  push:
    branches: ['**']
    # a version tag (v1.0, v1.1 … or V1.0) publishes a stable release
    tags: ['v*', 'V*']
  workflow_dispatch:

# Every job gets only the access it needs (see the jobs below).
permissions:
  contents: read

# Security layout (see the security audit, finding M1):
#   build         – builds an UNSIGNED APK; no signing key here, so the Gradle build and the third-party
#                   setup action never see one
#   sign-dev      – every build except stable releases: signs with the dev key → "ÚtSzelvény DEV"
#                   (package hu.szaszi.kozutszelveny.dev, installs next to the real app, own saved data)
#   sign-release  – only version tags: signs with the release key from the protected "release" environment
#                   (Settings → Environments; only V*/v* tags, waits for the owner's approval)
#   publish       – puts the signed APK into the GitHub release; no signing key here either
# All actions are pinned to a full commit SHA (the comment shows the version); Dependabot proposes updates.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.apk.outputs.name }}
      ver: ${{ steps.apk.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.9'
          # the open-source (MIT) cache; the default "enhanced" cache is closed-source and under Gradle's own terms
          cache-provider: basic

      - name: Find the Android project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found - the android folder is not in the repository. Files in the repository:"
            find . -not -path "./.git*" -type f | sort | head -100
            exit 1
          fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $d"

      # the texts block (id="texts") must be valid JSON and hold every key the app asks for
      - name: Check the texts block
        run: python3 tools/szovegek.py web/index.html

      # File name carries the version (stable release, main) or the branch name + build number (test branches),
      # e.g. UtSzelveny-V1.3.0.apk, UtSzelveny-DEV-V1.2.1.apk and UtSzelveny-test-auto-V1.2.1-b123.apk
      - name: Name the APK
        id: apk
        env:
          B: ${{ github.ref_name }}
          D: ${{ steps.proj.outputs.dir }}
          RUN: ${{ github.run_number }}
        run: |
          vn=$(grep -m1 'versionName' "$D/app/build.gradle" | sed -E 's/.*"([^"]+)".*/\1/')
          ver="V$(echo "$vn" | sed -E 's/-beta$/-Beta/; s/-stable$/-Stable/')"
          br=$(echo "$B" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="UtSzelveny-$ver.apk"; label=""
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            name="UtSzelveny-DEV-$ver.apk"; label="DEV · $ver"; bg="#7c3aed"
          else
            name="UtSzelveny-test-$br-$ver-b$RUN.apk"; label="TESZT · $br"; bg="#dc2626"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "bg=${bg:-}" >> "$GITHUB_OUTPUT"
          echo "APK: $name"

      # Stable releases get web/index.html unchanged. The DEV app gets the same changes as the /dev/ web page:
      # renamed saved-data keys (kszd_), which also switches the update check off (the DEV app must not offer
      # the real app as its update), and a small DEV / TESZT label.
      - name: Copy the web app (web/index.html) into the APK
        env:
          D: ${{ steps.proj.outputs.dir }}
          LABEL: ${{ steps.apk.outputs.label }}
          BG: ${{ steps.apk.outputs.bg }}
        run: |
          mkdir -p "$D/app/src/main/assets"
          out="$D/app/src/main/assets/index.html"
          if [ -z "$LABEL" ]; then
            cp web/index.html "$out"
          else
            sed \
              -e 's/"ksz_/"kszd_/g' \
              -e "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:$BG;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">$LABEL</div></body>|" \
              web/index.html > "$out"
            grep -q "$LABEL" "$out"
            grep -q 'UPD_KEY="kszd_"' "$out"
          fi

      - name: Build the unsigned APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          UTSZ_BUILD: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Keep the unsigned APK for the signing job
        env:
          D: ${{ steps.proj.outputs.dir }}
        run: cp "$D/app/build/outputs/apk/release/app-release-unsigned.apk" unsigned.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: unsigned.apk
          retention-days: 1

  # Dev key: repository secrets DEV_KEYSTORE_B64 / DEV_KEYSTORE_PASSWORD / DEV_KEY_ALIAS.
  # Dependabot's runs get no repository secrets, so they stop after the build (which is what they test).
  sign-dev:
    needs: build
    if: github.ref_type != 'tag' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Sign with the dev key
        env:
          KS_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          KEY_HINT: add DEV_KEYSTORE_B64, DEV_KEYSTORE_PASSWORD and DEV_KEY_ALIAS under Settings → Secrets and variables → Actions
          APK: ${{ needs.build.outputs.name }}
        run: bash .github/scripts/sign-apk.sh unsigned/unsigned.apk "$APK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ needs.build.outputs.name }}

  # Release key: only in the "release" environment (Settings → Environments → release), which only V*/v* tags
  # may use and which waits for the owner's approval (Actions tab → the run → Review deployments).
  # This job runs only GitHub's own actions and the signing script from this repository.
  sign-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: unsigned

      - name: Sign with the release key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_HINT: add RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS under Settings → Environments → release → Environment secrets
          APK: ${{ needs.build.outputs.name }}
        run: bash .github/scripts/sign-apk.sh unsigned/unsigned.apk "$APK"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ needs.build.outputs.name }}

  publish:
    needs: [build, sign-dev, sign-release]
    if: always() && needs.build.result == 'success' && (needs.sign-dev.result == 'success' || needs.sign-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write     # a stable release asks the Pages workflow to rebuild (landing page APK link)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.name }}

      # Test builds from other branches: own pre-release "apk-test-<branch>",
      # the public "apk-latest" stays untouched until the branch is merged into main.
      - name: Publish to the "apk-test-<branch>" release
        if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: apk-test-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ÚtSzelvény – TESZT APK (${{ github.ref_name }} ág)
          prerelease: true
          files: ${{ needs.build.outputs.name }}
          body: |
            TESZT változat a(z) ${{ github.ref_name }} ágból – nem a hivatalos kiadás.
            „ÚtSzelvény DEV” néven, a rendes alkalmazás mellé települ, saját mentett adatokkal; a korábbi DEV / TESZT telepítést felülírja.

      - name: Publish to the "apk-latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: apk-latest
          name: ÚtSzelvény – legfrissebb APK (DEV)
          prerelease: true
          files: ${{ needs.build.outputs.name }}
          body: |
            Automatikusan épített APK a main ág legutóbbi állapotából: ${{ needs.build.outputs.name }}
            „ÚtSzelvény DEV” néven, a rendes alkalmazás mellé települ, saját mentett adatokkal. A stabil kiadás: https://github.com/${{ github.repository }}/releases/latest
            Telepítés: töltsd le az APK fájlt a telefonon, és engedélyezd az ismeretlen forrásból történő telepítést.

      # Version tag (v1.0 …): a stable, non-pre-release GitHub Release; /releases/latest points to it.
      - name: Publish the stable release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ÚtSzelvény ${{ needs.build.outputs.ver }}
          prerelease: false
          make_latest: true
          # keep release notes written by hand on GitHub; the lines below are added after them
          append_body: true
          files: ${{ needs.build.outputs.name }}
          body: |
            ÚtSzelvény ${{ needs.build.outputs.ver }} – stabil kiadás. Változások: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
            Telepítés: töltsd le az APK fájlt a telefonon, és engedélyezd az ismeretlen forrásból történő telepítést.

      # The landing page links the stable release's APK file directly: rebuild the site now that it is attached.
      - name: Update the landing page APK link
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

      # Only the newest APK stays in the release (older file names are removed).
      - name: Remove older APKs from the release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/main' && 'apk-latest' || format('apk-test-{0}', github.ref_name) }}
          KEEP: ${{ needs.build.outputs.name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r a; do
            if [ -n "$a" ] && [ "$a" != "$KEEP" ]; then
              echo "removing $a"; gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" -y
            fi
          done
