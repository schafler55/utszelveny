name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the Android project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found - the android folder is not in the repository. Files in the repository:"
            find . -not -path "./.git*" -type f | sort | head -100
            exit 1
          fi
          d=$(dirname "$f")
          echo "dir=$d" >> "$GITHUB_OUTPUT"
          echo "Android project found in: $d"

      - name: Copy the web app (index.html) into the APK
        run: |
          mkdir -p "${{ steps.proj.outputs.dir }}/app/src/main/assets"
          cp index.html "${{ steps.proj.outputs.dir }}/app/src/main/assets/index.html"

      - name: Build APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" UtSzelveny.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UtSzelveny-apk-${{ github.ref_name }}
          path: UtSzelveny.apk

      # Test builds from other branches: own pre-release "apk-teszt-<branch>",
      # the public "apk-latest" stays untouched until the branch is merged into main.
      - name: Publish test APK (non-main branches)
        if: github.ref != 'refs/heads/main'
        run: cp UtSzelveny.apk UtSzelveny-teszt.apk

      - name: Publish to the "apk-teszt-<branch>" release
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teszt-${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ÚtSzelvény – TESZT APK (${{ github.ref_name }} ág)
          prerelease: true
          files: UtSzelveny-teszt.apk
          body: |
            TESZT változat a(z) ${{ github.ref_name }} ágból – nem a hivatalos kiadás.
            A telepített alkalmazást felülírja (ugyanaz az app), a beállítások megmaradnak.

      - name: Publish to the "apk-latest" release (stable download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ÚtSzelvény – legfrissebb APK
          prerelease: true
          files: UtSzelveny.apk
          body: |
            Automatikusan épített APK a main ág legutóbbi állapotából.
            Telepítés: töltsd le a UtSzelveny.apk fájlt a telefonon, és engedélyezd az ismeretlen forrásból történő telepítést.

  # Test web page for non-main branches, served by GitHub Pages from main under teszt/<branch>/:
  #   https://schafler55.github.io/kozutszelveny/teszt/<branch>/
  # Own settings (kszt_* keys), no service worker (it would clear the real app's offline cache),
  # and a small TESZT label. The real app at the site root is not touched.
  test-page:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: branch
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Build the test page
        env:
          B: ${{ github.ref_name }}
        run: |
          D="site/teszt/$B"
          mkdir -p "$D"
          sed -e 's/"ksz_/"kszt_/g' \
              -e 's|navigator.serviceWorker.register("sw.js")|Promise.reject()|' \
              -e "s#<title>\(.*\)</title>#<title>\1 – TESZT ($B)</title>#" \
              -e "s|</body>|<div style=\"position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:50;background:#dc2626;color:#fff;font:700 11px/1 Arial,sans-serif;padding:3px 8px;border-radius:6px;pointer-events:none\">TESZT · $B</div></body>|" \
              branch/index.html > "$D/index.html"
          cp branch/icon-192.png branch/icon-512.png "$D/"
          grep -q 'TESZT' "$D/index.html"
      - name: Publish it (commit to main, teszt/ folder only)
        env:
          B: ${{ github.ref_name }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add teszt
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Teszt oldal: $B (${GITHUB_SHA::7})"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1
