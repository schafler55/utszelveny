name: Close pull requests

# This project does not accept code contributions (see CONTRIBUTING.md).
# Pull requests from forks are closed automatically with a message.
# Pull requests from branches inside this repository are left alone: only
# the owner and the apps the owner installed (Claude, Dependabot) can push
# branches here, so their pull requests keep working.
# The workflow never checks out or runs code from the pull request.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request with a message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTRIBUTING_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md
        run: |
          MESSAGE="Köszönjük az érdeklődést! Ez a projekt nem fogad el kódhozzájárulást, ezért ezt a pull requestet automatikusan lezártuk, átnézés nélkül. Hibajelentést és ötletet szívesen fogadunk issue-ként – szavakban leírva, kód nélkül.

          Thank you for your interest! This project does not accept code contributions, so this pull request has been closed automatically and was not reviewed. Bug reports and feature suggestions are very welcome as issues – please describe them in words rather than code.

          [CONTRIBUTING.md]($CONTRIBUTING_URL)"

          gh pr close "$PR_NUMBER" --repo "$REPO" --comment "$MESSAGE"
